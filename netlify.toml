# netlify.toml — Netlify configuration for jga-os
# Project type: static (no build step required)
# Deploy method: Netlify GitHub App (Option A — Netlify-managed deploys)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

# ── Build settings ───────────────────────────────────────────────────────────
[build]
  # No build command needed — pure static HTML/CSS/JS
  publish = "."

# ── HTTP headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Redirects / SPA fallback (uncomment if you add client-side routing) ───────
# [[redirects]]
#   from   = "/*"
#   to     = "/index.html"
#   status = 200

# ── Cache hints ───────────────────────────────────────────────────────────────
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Production environment variables (names only — set values in Netlify UI) ──
# See docs/runbooks/SECRETS.md for the full list and instructions.
[context.production.environment]
  # NODE_ENV = "production"   # Uncomment/set in Netlify UI if needed

# ── Deploy-preview environment variables ──────────────────────────────────────
[context.deploy-preview.environment]
  # NODE_ENV = "development"  # Uncomment/set in Netlify UI if needed
