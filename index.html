<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>jga-os</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="desktop">
    <header class="top-bar">
      <div class="logo">jga-os</div>
      <div class="top-actions">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
    </header>

    <main class="main-area">
      <section class="dock">
        <button class="dock-icon" data-tab="home">Home</button>
        <button class="dock-icon" data-tab="about">About</button>
        <button class="dock-icon" data-tab="apps">Apps</button>
      </section>

      <section class="window">
        <!-- content injected by WindowManager -->
      </section>
    </main>

    <footer class="taskbar">
      <span class="taskbar-title">jga-os</span>
      <div class="taskbar-right">
        <span class="taskbar-clock" aria-live="polite"></span>
        <span class="taskbar-status" aria-live="polite">Loading…</span>
      </div>
    </footer>

    <div class="notifications" aria-live="polite" aria-atomic="false"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
