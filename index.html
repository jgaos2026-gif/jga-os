<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>jga-os</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="desktop">
    <header class="top-bar">
      <div class="logo">jga-os</div>
      <div class="top-actions">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
    </header>

    <main class="main-area">
      <section class="dock">
        <button class="dock-icon active">Home</button>
        <button class="dock-icon">About</button>
        <button class="dock-icon">Apps</button>
      </section>

      <section class="window">
        <h1>Welcome to jga-os</h1>
        <p>A minimal web desktop by jaysgraphicarts-ai.</p>
        <p>Edit this text to make it your own OS concept.</p>
      </section>
    </main>

    <footer class="taskbar">
      <span class="taskbar-title">jga-os</span>
      <span class="taskbar-status">Ready</span>
    </footer>
  </div>
</body>
</html>
